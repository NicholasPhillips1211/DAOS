name: CI Check

on:
  pull_request:
    branches: [ main ] # Trigger on PRs targeting the main branch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment
        # Example for Node.js; swap with setup-python or setup-go as needed
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test # This command must return a non-zero exit code if tests fail
