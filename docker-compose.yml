services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: daos
      POSTGRES_PASSWORD: daos
      POSTGRES_DB: daos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://daos:daos@postgres:5432/daos
    depends_on:
      - postgres
    ports:
      - "8000:8000"

volumes:
  postgres_data: {}
