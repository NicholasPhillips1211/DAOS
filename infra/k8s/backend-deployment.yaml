apiVersion: apps/v1
kind: Deployment
metadata:
  name: daos-backend
  labels:
    app: daos-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: daos-backend
  template:
    metadata:
      labels:
        app: daos-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/daos-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://daos:daos@postgres:5432/daos
            - name: CORS_ORIGINS
              value: '["http://localhost:5173"]'
            - name: RAW_STORAGE_ROOT
              value: /app/data/raw
            - name: MODEL_ARTIFACT_ROOT
              value: /app/data/models
          volumeMounts:
            - name: daos-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: daos-data
          persistentVolumeClaim:
            claimName: daos-data
---
apiVersion: v1
kind: Service
metadata:
  name: daos-backend
spec:
  selector:
    app: daos-backend
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daos-worker
  labels:
    app: daos-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daos-worker
  template:
    metadata:
      labels:
        app: daos-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/example/daos-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.runner", "--loop"]
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://daos:daos@postgres:5432/daos
            - name: RAW_STORAGE_ROOT
              value: /app/data/raw
            - name: MODEL_ARTIFACT_ROOT
              value: /app/data/models
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORKER_STALE_AFTER_SECONDS
              value: "300"
          volumeMounts:
            - name: daos-data
              mountPath: /app/data
      volumes:
        - name: daos-data
          persistentVolumeClaim:
            claimName: daos-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: daos-data
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
