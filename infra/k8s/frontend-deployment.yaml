apiVersion: apps/v1
kind: Deployment
metadata:
  name: daos-frontend
  labels:
    app: daos-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daos-frontend
  template:
    metadata:
      labels:
        app: daos-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/example/daos-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: daos-frontend
spec:
  selector:
    app: daos-frontend
  ports:
    - port: 80
      targetPort: 5173
  type: ClusterIP
